<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icones que eu possivelmente irei usar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

</head>

<body>
    <p>Icones que eu possivelmente irei usar</p>
    <h1>
        <i class="fa-solid fa-users-gear"></i>
        <i class="fa-solid fa-users-viewfinder"></i>
        <i class="fa-solid fa-user-shield"></i>
        <i class="fa-solid fa-user-slash"></i>
        <i class="fa-solid fa-user-tag"></i>
        <i class="fa-solid fa-user-police"></i>
        <i class="fa-solid fa-user-police-tie"></i>
        <i class="fa-solid fa-user-lock"></i>
        <i class="fa-solid fa-user-group"></i>
        <i class="fa-solid fa-user-gear"></i>
        <i class="fa-solid fa-user-check"></i>
        <i class="fa-solid fa-up-right-from-square"></i>
        <i class="fa-solid fa-triangle-exclamation"></i>
        <i class="fa-solid fa-circle-user"></i>
        <i class="fa-solid fa-filter"></i>
        <i class="fa-solid fa-bell"></i>
        <i class="fas fa-eye"></i>
    </h1>
        <div id="notificacaoIcon" style="position:fixed;right:1rem;top:1rem;z-index:1050;cursor:pointer;">
            <i class="fas fa-bell fa-2x"></i>
            <span id="notCount" style="background:#dc3545;color:#fff;border-radius:50%;padding:0.15rem 0.45rem;font-size:0.75rem;position:relative;left:-10px;top:-10px;">0</span>
        </div>
        <div id="notPanel" style="position:fixed;right:1rem;top:3.5rem;width:360px;max-height:400px;overflow:auto;background:#fff;border:1px solid #ddd;box-shadow:0 6px 18px rgba(0,0,0,0.1);display:none;z-index:1060;padding:1rem;border-radius:8px;">
            <h4 style="margin-top:0">Notificações</h4>
            <div id="notList">Carregando...</div>
        </div>
        <script>
            // Prevent duplicate notification widgets and hide header bell icons if floating widget exists
            (function(){ try {
                const icons = document.querySelectorAll('#notificacaoIcon');
                if (icons.length > 1) {
                    // keep the last inserted widget, remove earlier duplicates
                    for (let i = 0; i < icons.length - 1; i++) icons[i].remove();
                }
                // hide any decorative header bell icons to avoid visual duplication
                const headerBells = document.querySelectorAll('header .fa-bell, .header-right .fa-bell, h2 i.fa-bell');
                if (document.getElementById('notificacaoIcon')) {
                    headerBells.forEach(el => { if (!el.closest('#notificacaoIcon')) el.style.display = 'none'; });
                }
            } catch (e) { /* fail silently */ } })();

            const notIcon = document.getElementById('notificacaoIcon');
            const notPanel = document.getElementById('notPanel');
            const notList = document.getElementById('notList');
            const notCount = document.getElementById('notCount');

            function carregarNotificacoes(){
                if (!notList || !notCount) return;
                fetch('./backend/api/notifications.php', { credentials: 'include' })
                    .then(r=>r.json())
                    .then(d=>{
                        const items = d.notificacoes || [];
                        notCount.textContent = items.length;
                        notList.innerHTML = items.length ? items.map(n => `<div style="padding:.5rem;border-bottom:1px solid #eee;"><strong>${n.titulo}</strong><div style="font-size:.9rem;color:#555">${n.mensagem}</div><small style="color:#999">${n.data}</small></div>`).join('') : '<div style="color:#666">Sem notificações</div>';
                    })
                    .catch(()=> notList.innerHTML = '<div style="color:#c00">Erro ao carregar</div>');
            }

            if (notIcon && notPanel) {
                notIcon.addEventListener('click', ()=>{
                    if (notPanel.style.display === 'block') notPanel.style.display = 'none';
                    else { carregarNotificacoes(); notPanel.style.display = 'block'; }
                });
            }
        </script>
    <a href="auth/login/login.html">Ir para login</a>
</body>

</html>
