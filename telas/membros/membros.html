<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISPEXA - Gestão de Membros</title>
    <link rel="stylesheet" href="../../styles/base/reset.css">
    <link rel="stylesheet" href="../../styles/base/variables.css">
    <link rel="stylesheet" href="../../styles/components/buttons.css">
    <link rel="stylesheet" href="../../styles/components/tables.css">
    <link rel="stylesheet" href="../../styles/components/forms.css">
    <link rel="stylesheet" href="membros.css">
    <link rel="stylesheet" href="../../styles/base/sidebar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
     <link rel="shortcut icon" type="image/x-icon" href="../../imagens/icons/macaicon.png" >
</head>

<body>
    <div id="bglhdecima">
        <button class="sidebar-toggle" id="sidebarToggle">
            <i class="fas fa-bars"></i>
        </button>
        <button class="voltar"><a class="voltar" href="../painel/painel.html"><i class="fa-solid fa-arrow-left"></i></a>
        </button>
        <div id="notificacaoIcon" style="position:fixed;right:1rem;top:1rem;z-index:1050;cursor:pointer;">
            <i class="fas fa-bell fa-2x"></i>
            <span id="notCount" style="background:#dc3545;color:#fff;border-radius:50%;padding:0.15rem 0.45rem;font-size:0.75rem;position:relative;left:-10px;top:-10px;">0</span>
        </div>
        <div id="notPanel" style="position:fixed;right:1rem;top:3.5rem;width:360px;max-height:400px;overflow:auto;background:#fff;border:1px solid #ddd;box-shadow:0 6px 18px rgba(0,0,0,0.1);display:none;z-index:1060;padding:1rem;border-radius:8px;">
            <h4 style="margin-top:0">Notificações</h4>
            <div id="notList">Carregando...</div>
        </div>

    </div>
    <div class="membros">
        <header>
            <h1>DISPEXA </h1>
            <h2 class="membrosd">Membros</h2>
            <h2>
                <i class="fa-solid fa-triangle-exclamation"></i>
                <i class="fa-solid fa-bell"></i>
                <i class="fa-solid fa-circle-user"></i>
            </h2>
        </header>


        <nav class="sidebar">
            <ul>
                <a href="../painel/painel.html">
                    <li><i class="fas fa-network-wired"></i>Painel</li>
                </a>

                <a href="membros.html">
                    <li class="active"><i class="fas fa-users"></i>Grupos
                    </li>
                </a>


                <a href="../alimentos/alimentos.html">
                    <li><i class="fas fa-utensils"></i>Alimentos</li>
                </a>


                <a href="../categorias/categorias.html">
                    <li><i class="fas fa-tags"></i>Categorias</li>
                </a>

                <a href="../relatorios/relatorios.html">
                    <li><i class="fa-solid fa-file-invoice"></i>Relatórios</li>
                </a>

                 <a href="../sobre/sobre.html">
                    <li class=""><i class="fa-solid fa-circle-info"></i>Sobre</li>
                </a>

                   <button id="btnLogout"><i class="fas fa-sign-out-alt"></i> Sair</button>
                

            </ul>
        </nav>



        <div class="membros-container">
            <div class="header">


            </div>

            <!-- Barra de ferramentas -->
            <div class="toolbar">

                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Buscar membros..." id="inputBusca">
                </div>
                <select class="filter-select" id="filtroStatus">
                    <option value="">Todos os status</option>
                    <option value="ativo">Ativos</option>
                    <option value="inativo">Inativos</option>
                </select>

            </div>

            <!-- Tabela de membros -->
            <div class="table-responsive">
                <button class="btn btn-primary" id="btnNovoMembro">
                    ADICIONAR
                </button>
                <table class="membros-table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaMembros">
                        <!-- Dados serão carregados via JavaScript -->
                        <tr>
                            <td>João Silva</td>
                            <td>32 anos</td>
                            <td><span class="status-badge status-ativo">Ativo</span></td>
                            <td class="acoes-cell">
                                <button class="btn-acao btn-editar" data-id="">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn-acao btn-excluir" data-id="2">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                        <tr>
                            <td>Maria Santos</td>
                            <td>30 anos</td>
                            <td><span class="status-badge status-ativo">Ativo</span></td>
                            <td class="acoes-cell">
                                <button class="btn-acao btn-editar" data-id="2">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn-acao btn-excluir" data-id="2">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>

                    </tbody>
                </table>
            </div>

            <!-- Paginação -->
            <div class="pagination">
                <button disabled><i class="fas fa-chevron-left"></i></button>
                <button class="active">1</button>
                <button>2</button>
                <button>3</button>
                <button><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>

        <!-- Modal de Cadastro/Edição -->
        <div class="modal" id="modalMembro">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitulo">Adicionar novo membro</h2>
                    <button class="close-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="formMembro">
                        <input type="hidden" id="membroId">

                        <div class="form-row">
                            <div class="form-group">
                                <label for="nome">Nome Completo*</label>
                                <input type="text" id="nome" name="nome" required>
                            </div>

                            <div class="form-group">
                                <label for="status">Status*</label>
                                <select id="status" name="status" required>
                                    <option value="">Selecione</option>
                                    <option value="ativo">Ativo</option>
                                    <option value="inativo">Inativo</option>

                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="dataNascimento">Data de Nascimento*</label>
                                <input type="date" id="dataNascimento" name="dataNascimento" required>
                            </div>

                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="responsavel">Responsável?</label>
                                <select id="responsavel" name="responsavel">
                                    <option value="">Selecione</option>
                                    <option value="nao">Não</option>
                                    <option value="sim">Sim</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="foto">Foto (Opcional)</label>
                                <input type="file" id="foto" name="foto" accept="image/*">
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="btnAdicionar">ADICIONAR</button>

                            <button type="button" class="btn btn-secondary" id="btnCancelar">Cancelar</button>

                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <script src="membros.js"></script>
    <script>
        // session check
        fetch('../../backend/api/session.php', { credentials: 'include' })
            .then(r => r.json())
            .then(j => { if (!j.logged_in) window.location.href='../../telas/auth/login/login.html'; });

        // Prevent duplicate notification widgets and hide header bells
        (function(){ try {
            const icons = document.querySelectorAll('#notificacaoIcon');
            if (icons.length > 1) for (let i = 0; i < icons.length - 1; i++) icons[i].remove();
            const headerBells = document.querySelectorAll('header .fa-bell, h2 i.fa-bell');
            if (document.getElementById('notificacaoIcon')) headerBells.forEach(el => { if (!el.closest('#notificacaoIcon')) el.style.display='none'; });
        } catch(e) { /* silent */ } })();

        const notIcon = document.getElementById('notificacaoIcon');
        const notPanel = document.getElementById('notPanel');
        const notList = document.getElementById('notList');
        const notCount = document.getElementById('notCount');

        function carregarNotificacoes(){
            if (!notList || !notCount) return;
            fetch('../../backend/api/notifications.php', { credentials: 'include' })
                .then(r=>r.json())
                .then(d=>{
                    const items = d.notificacoes || [];
                    notCount.textContent = items.length;
                    notList.innerHTML = items.length ? items.map(n=>`<div style="padding:.5rem;border-bottom:1px solid #eee;"><strong>${n.titulo}</strong><div style="font-size:.9rem;color:#555">${n.mensagem}</div><small style="color:#999">${n.data}</small></div>`).join('') : '<div style="color:#666">Sem notificações</div>';
                })
                .catch(()=> notList.innerHTML = '<div style="color:#c00">Erro ao carregar</div>');
        }

        if (notIcon && notPanel) {
            notIcon.addEventListener('click', ()=>{ if(notPanel.style.display==='block') notPanel.style.display='none'; else { carregarNotificacoes(); notPanel.style.display='block'; } });
        }
    </script>
</body>

</html>
